# Starship prompt config
# Docs: https://starship.rs/config/

format = """
$directory$git_branch$git_status$nodejs$python$rust$golang$cmd_duration
$character"""

# ─── Directory ────────────────────────────────────────────────────────────────
[directory]
truncation_length = 4
truncate_to_repo = true
style = "bold cyan"

# ─── Git ─────────────────────────────────────────────────────────────────────
[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold red"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "!${count}"
untracked = "?${count}"
staged = "+${count}"
deleted = "✘${count}"

# ─── Languages (only shown when relevant) ─────────────────────────────────────
[nodejs]
symbol = " "
style = "bold green"

[python]
symbol = " "
style = "bold yellow"

[rust]
symbol = " "
style = "bold red"

[golang]
symbol = " "
style = "bold cyan"

# ─── Command duration (show if > 2s) ─────────────────────────────────────────
[cmd_duration]
min_time = 2000
format = " took [$duration](bold yellow)"

# ─── Prompt character ─────────────────────────────────────────────────────────
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
